name: Build and Test
on: push

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [ 24, 25-ea ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin

      - name: Cache Maven artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Cache node
        uses: actions/cache@v4
        with:
          path: web-bundle/node
          key: ${{ runner.os }}-node-${{ hashFiles('web-bundle/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: web-bundle/node_modules
          key: ${{ runner.os }}-nodemod-${{ hashFiles('web-bundle/package.json') }}
          restore-keys: |
            ${{ runner.os }}-nodemod-

      - name: Build ${{ matrix.java-version }}
        run: mvn -B clean test


  # ---------------------------------------------------------
  # 🔥 Nouveau job : mutation-check (PIT + comparaison) 🔥
  # ---------------------------------------------------------
  mutation-check:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: 24
          distribution: temurin
          cache: maven

      # ⭐ IMPORTANT : Build complet avant PIT (corrige ton erreur ❗)
      - name: Build all modules before PIT
        run: mvn -B -ntp clean install -DskipTests

      - name: Run PIT on HEAD
        id: pit_head
        run: |
          mvn -B -ntp -pl core -am -DfailWhenNoMutations=false org.pitest:pitest-maven:mutationCoverage
          SCORE=$(grep -oP "Mutation\s*Coverage[^0-9]*\K[0-9]+\.[0-9]+" -h core/target/pit-reports/*/index.html | head -1)
          echo "score=$SCORE" >> $GITHUB_OUTPUT
          echo "HEAD SCORE = $SCORE"

      - name: Run PIT on BASE branch
        if: ${{ github.event_name == 'pull_request' }}
        id: pit_base
        run: |
          git checkout ${{ github.event.pull_request.base.sha }}
          mvn -B -ntp clean install -DskipTests
          mvn -B -ntp -pl core -am -DfailWhenNoMutations=false org.pitest:pitest-maven:mutationCoverage
          BASE=$(grep -oP "Mutation\s*Coverage[^0-9]*\K[0-9]+\.[0-9]+" -h core/target/pit-reports/*/index.html | head -1)
          echo "base=$BASE" >> $GITHUB_OUTPUT
          echo "BASE SCORE = $BASE"

      - name: Compare mutation score
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          HEAD=${{ steps.pit_head.outputs.score }}
          BASE=${{ steps.pit_base.outputs.base }}

          echo "HEAD=$HEAD"
          echo "BASE=$BASE"

          if (( $(echo "$HEAD < $BASE" | bc -l) )); then
            echo "❌ Mutation score decreased → FAIL"
            exit 1
          fi

          echo "✅ Mutation score OK"
  
