name: Build and Test
on: push

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [24]

    steps:

      # Checkout repository
      - uses: actions/checkout@v4

      # Java 24 for main build
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin

      # Cache Maven
      - name: Cache Maven artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Cache node
      - name: Cache node
        uses: actions/cache@v4
        with:
          path: web-bundle/node
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # Cache node_modules
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: web-bundle/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node_modules-

      # Build sans tests
      - name: Build and Test ${{ matrix.java-version }}
        run: mvn -B clean install -DskipTests

      # Run tests
      - name: Run Tests
        if: success()
        run: mvn -B test

      # Switch to Java 21 for PIT
      - name: Setup Java 21 for PIT
        if: success()
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      # Run PIT in core module only
      - name: Run PIT Mutation Testing (core)
        if: success()
        run: |
          cd core
          mvn -B org.pitest:pitest-maven:mutationCoverage

      # Extract & validate mutation score
      - name: Check Mutation Score
        if: always()
        run: |
          REPORT=$(ls core/target/pit-reports/*/index.html | head -1)

          # Extract correct mutation coverage %
          MUTATION_SCORE=$(grep -oP '(?<=Mutation coverage</th><td>)[0-9]+' "$REPORT")

          echo "📊 Mutation Score: ${MUTATION_SCORE}%"

          MIN_SCORE=50

          if [ "$MUTATION_SCORE" -lt "$MIN_SCORE" ]; then
            echo "::error title=Mutation Score Too Low::Mutation score ($MUTATION_SCORE%) is below minimum threshold ($MIN_SCORE%)"
            exit 1
          fi

          echo "✓ Mutation score acceptable"

      # Upload PIT report
      - name: Upload PIT Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-report-java-${{ matrix.java-version }}
          path: core/target/pit-reports

      # Rickroll on failure
      - name: Rickroll
        if: failure()
        run: |
          echo "######################################################"
          echo "                     OHÉ MATELOT !!"
          echo "               Vos tests ont *échoué* 😭"
          echo "######################################################"

          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
  ![MEME](https://blog.zegocloud.com/wp-content/uploads/2024/02/programming-meme-22.jpg)
  
  ### 💀 *Un ou plusieurs tests ont échoué…*  
  Corrige ton code avant que le navire coule ⚓🔥
  EOF
